<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Organic True Roselily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020101; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute; top: 12%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .greeting {
            color: #ffda75; font-size: 24px; font-weight: 300; letter-spacing: 5px;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0; transform: translateY(10px);
            animation: fadeUp 3s ease forwards; animation-delay: 1s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.6); font-size: 11px; letter-spacing: 7px;
            margin-top: 8px; text-transform: uppercase;
            opacity: 0; animation: fadeUp 3s ease forwards; animation-delay: 2s;
        }
        .interaction-hint {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; pointer-events: none;
            transition: opacity 1.5s ease; animation: pulseHint 3s infinite;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseHint {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint" id="hint">Tippe, um die Lilie zu wecken</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 650; 
        let points = [];
        let targetBloom = 0; 
        let currentBloom = 0;
        let isFullyBloomed = false;

        class AnimatedPoint {
            constructor(cx, cy, cz, ox, oy, oz, color, bloomDelay) {
                this.cx = cx; this.cy = cy; this.cz = cz; 
                this.ox = ox; this.oy = oy; this.oz = oz; 
                this.x = cx; this.y = cy; this.z = cz;
                this.color = color;
                
                this.bloomDelay = bloomDelay; 
                this.bloomSpeed = 0.7 + Math.random() * 0.5; 
            }

            update(globalBloom) {
                let localBloom = Math.max(0, Math.min(1, (globalBloom - this.bloomDelay) * this.bloomSpeed * 1.5));
                let ease = localBloom < 0.5 ? 2 * localBloom * localBloom : 1 - Math.pow(-2 * localBloom + 2, 2) / 2;

                this.x = this.cx + (this.ox - this.cx) * ease;
                this.y = this.cy + (this.oy - this.cy) * ease;
                this.z = this.cz + (this.oz - this.cz) * ease;
            }
        }

        function generateOrganicLily() {
            points = [];
            
            // DIE 3 SCHICHTEN: Klar getrennt durch Lift (Aufstellung) und Drop (Hängen)
            const layers = [
                // Äußere Schicht: Fallen schwer nach unten, weit geöffnet
                { count: 6, radius: 270, lift: 70, drop: 220, delay: 0.0, points: 1500 },
                // Mittlere Schicht: Halber Winkel, dynamisch gebogen
                { count: 6, radius: 210, lift: 130, drop: 90, delay: 0.2, points: 1200 },
                // Innere Schicht: Bilden einen tiefen, aufrechten Kelch
                { count: 6, radius: 150, lift: 170, drop: 15, delay: 0.4, points: 900 }
            ];

            layers.forEach((layer, layerIndex) => {
                for (let p = 0; p < layer.count; p++) {
                    let angleOffset = (Math.random() - 0.5) * 0.3;
                    let baseAngle = (Math.PI * 2 / layer.count) * p + (layerIndex * 0.4) + angleOffset;
                    
                    // INDIVIDUELLE BLATT-PHYSIK (Das Chaos der Natur)
                    let indDrop = layer.drop * (0.5 + Math.random() * 0.8); // Drop variiert extrem
                    let indLift = layer.lift * (0.8 + Math.random() * 0.4);
                    let lengthMod = 0.85 + Math.random() * 0.3;
                    let widthMod = 0.7 + Math.random() * 0.5;
                    let petalTwist = (Math.random() - 0.5) * 0.6; // Blatt windet sich um die eigene Achse
                    let asymmetricalCurve = Math.random() * 0.5; // Biege-Punkt verschiebt sich

                    for (let i = 0; i < layer.points; i++) {
                        let t = Math.random(); 
                        let w = (Math.random() - 0.5) * 2; 
                        
                        // Das Blatt verdreht sich organisch nach außen hin
                        let petalAngle = baseAngle + (t * petalTwist);

                        // --- OFFENER ZUSTAND ---
                        let radiusOpen = t * layer.radius * lengthMod;
                        
                        // Die organische Höhenkurve: Ein asymmetrischer Bogen
                        let pyOpen = -Math.sin(t * Math.PI * (0.8 + asymmetricalCurve)) * indLift + Math.pow(t, 2.5) * indDrop;
                        
                        let widthOpen = Math.sin(t * Math.PI) * (1 - t * 0.15) * 75 * widthMod;
                        let ruffles = Math.sin(t * 35) * Math.sin(w * Math.PI) * 10; 
                        
                        // Tiefe Mittelfalte für plastisches Volumen
                        if (Math.abs(w) < 0.2) {
                            pyOpen += 15 * Math.sin(t * Math.PI); 
                        }

                        let lateralOpen = w * widthOpen + ruffles;
                        
                        let ox = Math.cos(petalAngle) * radiusOpen - Math.sin(petalAngle) * lateralOpen;
                        let oz = Math.sin(petalAngle) * radiusOpen + Math.cos(petalAngle) * lateralOpen;
                        let oy = pyOpen;
                        
                        // Tiefen-Rauschen für den Acryl/Pastos-Effekt
                        let nX = (Math.random() - 0.5) * 4;
                        let nY = (Math.random() - 0.5) * 4;
                        let nZ = (Math.random() - 0.5) * 4;
                        ox += nX; oy += nY; oz += nZ;

                        // --- GESCHLOSSENE KNOSPE ---
                        let radiusClosed = t * 40 + Math.sin(t * Math.PI) * 25; 
                        let pyClosed = -t * (240 - layerIndex * 20); 
                        let widthClosed = Math.sin(t * Math.PI) * 25;
                        let lateralClosed = w * widthClosed;
                        
                        let closedAngle = baseAngle + (t * Math.PI * 0.8);

                        let cx = Math.cos(closedAngle) * radiusClosed - Math.sin(closedAngle) * lateralClosed;
                        let cz = Math.sin(closedAngle) * radiusClosed + Math.cos(closedAngle) * lateralClosed;
                        let cy = pyClosed;
                        cx += nX*0.5; cy += nY*0.5; cz += nZ*0.5;

                        // --- FARBE: KONTRAST FÜR TIEFE ---
                        let color;
                        let absW = Math.abs(w);
                        let hue = 335; 
                        
                        if (t < 0.2) {
                            // Gelbgrüner Trichter (Schatten)
                            let dark = layerIndex === 2 ? 40 : 25; // Innere Blätter leuchten etwas mehr
                            color = `hsla(60, 90%, ${dark}%, 1)`; 
                        } else {
                            let saturation = 95 - (t * 20); 
                            
                            // Die Spitzen und Ränder werden weiß/hellrosa
                            let lightness = 35 + (t * 50) + (absW * 30);
                            
                            // Äußere Blätter sind am Rand einen Hauch dunkler, um die inneren strahlen zu lassen
                            if (layerIndex === 0) lightness -= 10;
                            
                            if (lightness > 92) lightness = 95; 
                            color = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.85)`;
                        }

                        // Sommersprossen
                        if (t > 0.3 && t < 0.75 && absW < 0.45) {
                            if (Math.random() < 0.06) {
                                color = `hsla(330, 100%, 20%, 1)`; // Tiefes Magenta
                                oy -= 2.5; cy -= 1; // Erhabene Textur
                            }
                        }

                        let individualDelay = layer.delay + (Math.random() * 0.15);
                        points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, individualDelay));
                    }
                }
            });

            // DIE STAUBGEFÄßE (Pistils & Stamens - asymmetrisch!)
            for (let s = 0; s < 9; s++) { 
                let angle = (Math.PI * 2 / 9) * s + (Math.random() - 0.5) * 0.5;
                let lengthMod = 0.8 + Math.random() * 0.4;
                
                for(let i = 0; i < 250; i++) {
                    let t = Math.random();
                    
                    let radiusOpen = t * 160 * lengthMod;
                    // Hängen unterschiedlich weit durch
                    let pyOpen = -Math.sin(t * Math.PI * (0.7 + Math.random()*0.2)) * 180;
                    let ox = Math.cos(angle) * radiusOpen + (Math.random()-0.5)*4;
                    let oz = Math.sin(angle) * radiusOpen + (Math.random()-0.5)*4;
                    let oy = pyOpen + (Math.random()-0.5)*4;

                    let cx = Math.cos(angle) * (t * 8);
                    let cz = Math.sin(angle) * (t * 8);
                    let cy = -t * 190;

                    let color;
                    if (t > 0.9) {
                        ox += (Math.random() - 0.5) * 15;
                        oy += (Math.random() - 0.5) * 20;
                        oz += (Math.random() - 0.5) * 15;
                        color = `hsla(30, 100%, 50%, 1)`; // Leuchtendes Orange
                    } else {
                        color = `hsla(70, 40%, 75%, 0.7)`; // Filamente
                    }
                    
                    points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, 0.5));
                }
            }
        }

        generateOrganicLily();

        // --- TOUCH STEUERUNG ---
        let rotX = -0.3; 
        let rotY = 0;
        let vX = 0;
        let vY = 0.005; 
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function handlePointerDown(e) {
            if (targetBloom === 0) {
                targetBloom = 1;
                hint.style.opacity = '0';
            }

            isDragging = true;
            prevTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            prevTouchY = e.clientY || (e.touches && e.touches[0].clientY);
            vX = 0; vY = 0; 
        }

        function handlePointerMove(e) {
            if (isDragging) {
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                vY = (currentX - prevTouchX) * 0.005; 
                vX = (currentY - prevTouchY) * 0.005; 
                
                prevTouchX = currentX;
                prevTouchY = currentY;
            }
        }

        function handlePointerUp() {
            isDragging = false;
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('touchstart', handlePointerDown, {passive: true});
        window.addEventListener('touchmove', handlePointerMove, {passive: true});
        window.addEventListener('touchend', handlePointerUp);

        // --- RENDER LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 2, 0.5)';
            ctx.fillRect(0, 0, width, height);

            if (currentBloom < targetBloom) {
                currentBloom += 0.004; 
            }
            if (currentBloom > 0.95 && !isFullyBloomed) {
                isFullyBloomed = true;
                hint.innerHTML = "Wische, um die organischen Details zu betrachten";
                hint.style.opacity = '1';
                hint.style.animation = 'none'; 
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));

            if (!isDragging) {
                vY *= 0.95;
                vX *= 0.95;
                if (Math.abs(vY) < 0.0005) vY += 0.002; 
            }

            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const centerX = width / 2;
            const centerY = height / 2 + 60; 

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(currentBloom);

                let x = p.x;
                let y = p.y;
                let z = p.z;

                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                let scale = fov / (fov + z2 + 350); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    let size = Math.max(0.6, 1.6 * scale); 
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
