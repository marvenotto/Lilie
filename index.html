<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Perfect Harmony</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020101; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute; top: 12%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .greeting {
            color: #ffda75; font-size: 24px; font-weight: 300; letter-spacing: 5px;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0; transform: translateY(10px);
            animation: fadeUp 3s ease forwards; animation-delay: 1s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.6); font-size: 11px; letter-spacing: 7px;
            margin-top: 8px; text-transform: uppercase;
            opacity: 0; animation: fadeUp 3s ease forwards; animation-delay: 2s;
        }
        .interaction-hint {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; pointer-events: none;
            transition: opacity 1.5s ease; animation: pulseHint 3s infinite;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseHint {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint" id="hint">Tippe, um die Blüte zu entfalten</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 650; 
        let points = [];
        let targetBloom = 0; 
        let currentBloom = 0;
        let isFullyBloomed = false;

        class AnimatedPoint {
            constructor(cx, cy, cz, ox, oy, oz, color, bloomDelay) {
                this.cx = cx; this.cy = cy; this.cz = cz; // Position in der geschlossenen Knospe
                this.ox = ox; this.oy = oy; this.oz = oz; // Position in der offenen Blüte
                this.x = cx; this.y = cy; this.z = cz;
                this.color = color;
                
                this.bloomDelay = bloomDelay; 
                this.bloomSpeed = 0.8 + Math.random() * 0.4; 
            }

            update(globalBloom) {
                let localBloom = Math.max(0, Math.min(1, (globalBloom - this.bloomDelay) * this.bloomSpeed * 1.5));
                // Extrem weiche Ease-In-Out Funktion für seidige Animation
                let ease = localBloom < 0.5 ? 2 * localBloom * localBloom : 1 - Math.pow(-2 * localBloom + 2, 2) / 2;

                this.x = this.cx + (this.ox - this.cx) * ease;
                this.y = this.cy + (this.oy - this.cy) * ease;
                this.z = this.cz + (this.oz - this.cz) * ease;
            }
        }

        function generateElegantLily() {
            points = [];
            
            // DIE 2 KLASSISCHEN SCHICHTEN EINER LILIE (3 äußere Kelchblätter, 3 innere Kronblätter)
            const layers = [
                // Äußere Schicht (liegen etwas tiefer, biegen sich minimal mehr)
                { count: 3, radius: 260, lift: 90, drop: 40, delay: 0.0, points: 4500, offsetAngle: 0 },
                // Innere Schicht (stehen leicht erhaben, formen den Trichter)
                { count: 3, radius: 250, lift: 110, drop: 20, delay: 0.2, points: 4500, offsetAngle: Math.PI / 3 }
            ];

            layers.forEach((layer, layerIndex) => {
                for (let p = 0; p < layer.count; p++) {
                    let baseAngle = (Math.PI * 2 / layer.count) * p + layer.offsetAngle;

                    for (let i = 0; i < layer.points; i++) {
                        let t = Math.random(); // Länge (0 bis 1)
                        let w = (Math.random() - 0.5) * 2; // Breite (-1 bis 1)
                        let absW = Math.abs(w);
                        
                        // --- OFFENER ZUSTAND (Natürlich & Elegant) ---
                        let radiusOpen = t * layer.radius;
                        
                        // Sanfte Trompetenform: Leicht aufwärts gerichtet (Lift), am Ende ganz sanft abfallend (Drop)
                        let pyOpen = -Math.sin(t * Math.PI * 0.7) * layer.lift + Math.pow(t, 2.5) * layer.drop;
                        
                        // Blattbreite: Breit in der Mitte, spitz zulaufend
                        let widthOpen = Math.sin(t * Math.PI) * (1 - t * 0.15) * 85;
                        
                        // Zarte Wellen an den Rändern, NICHT im Zentrum
                        let ruffles = Math.sin(t * 20) * Math.sin(w * Math.PI) * (4 * t); 
                        
                        // DIE TIEFE MITTELFALTE (Für die 3D Struktur)
                        // Wenn der Punkt sehr nah an der Mitte ist (w nahe 0), wird er nach "unten" gedrückt
                        let midrib = Math.max(0, 1 - absW * 5) * 12 * Math.sin(t * Math.PI);
                        pyOpen += midrib;

                        let lateralOpen = w * widthOpen + ruffles;
                        
                        let ox = Math.cos(baseAngle) * radiusOpen - Math.sin(baseAngle) * lateralOpen;
                        let oz = Math.sin(baseAngle) * radiusOpen + Math.cos(baseAngle) * lateralOpen;
                        let oy = pyOpen;
                        
                        // Feines Rauschen für Volumen
                        let nX = (Math.random() - 0.5) * 3;
                        let nY = (Math.random() - 0.5) * 3;
                        let nZ = (Math.random() - 0.5) * 3;
                        ox += nX; oy += nY; oz += nZ;

                        // --- GESCHLOSSENER ZUSTAND (Elegante, spiralförmige Knospe) ---
                        let radiusClosed = t * 35 + Math.sin(t * Math.PI) * 20; 
                        let pyClosed = -t * (240 - layerIndex * 15); 
                        let widthClosed = Math.sin(t * Math.PI) * 25;
                        let lateralClosed = w * widthClosed;
                        
                        let closedAngle = baseAngle + (t * Math.PI * 0.5); // Sanfte Spirale

                        let cx = Math.cos(closedAngle) * radiusClosed - Math.sin(closedAngle) * lateralClosed;
                        let cz = Math.sin(closedAngle) * radiusClosed + Math.cos(closedAngle) * lateralClosed;
                        let cy = pyClosed;
                        cx += nX*0.5; cy += nY*0.5; cz += nZ*0.5;

                        // --- DER HARMONISCHE FARBVERLAUF ---
                        let color;
                        if (t < 0.15) {
                            // Zentrum: Warmes, leuchtendes Gelb-Grün
                            color = `hsla(55, 80%, 55%, 0.9)`; 
                        } else {
                            let hue = 335; // Nayas Pink
                            // Sättigung nimmt nach außen leicht ab
                            let saturation = 95 - (t * 25) - (absW * 15); 
                            
                            // Helligkeit steigt nach außen und zu den Rändern stark an (Weiß-Rosa)
                            let lightness = 45 + (t * 40) + (absW * 25);
                            
                            // Äußere Schicht minimal dunkler für Tiefenwirkung
                            if (layerIndex === 0) lightness -= 5;
                            if (lightness > 92) lightness = 95; // Strahlendes Weiß an den Kanten
                            
                            color = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.85)`;
                        }

                        // Zarte Sommersprossen in der Mitte des Blattes
                        if (t > 0.25 && t < 0.65 && absW < 0.45) {
                            if (Math.random() < 0.04) {
                                color = `hsla(335, 90%, 25%, 1)`; // Tiefdunkles Magenta
                                oy -= 2; cy -= 1; // Liegen leicht erhaben auf dem Blatt
                            }
                        }

                        let individualDelay = layer.delay + (Math.random() * 0.1);
                        points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, individualDelay));
                    }
                }
            });

            // DIE 6 STAUBGEFÄßE & 1 STEMPEL (Pistil & Stamens)
            for (let s = 0; s < 7; s++) { 
                let isPistil = (s === 6);
                let angle = isPistil ? 0 : (Math.PI * 2 / 6) * s + (Math.PI / 6);
                
                for(let i = 0; i < (isPistil ? 200 : 150); i++) {
                    let t = Math.random();
                    
                    // Elegante, natürliche Biegung der Fäden
                    let radiusOpen = isPistil ? (t * 20) : (t * 120);
                    let pyOpen = -Math.sin(t * Math.PI * 0.8) * (isPistil ? 160 : 140);
                    
                    let ox = Math.cos(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oz = Math.sin(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oy = pyOpen + (Math.random()-0.5)*3;

                    // Geschlossen in der Knospe eingeklemmt
                    let cx = Math.cos(angle) * (t * 5);
                    let cz = Math.sin(angle) * (t * 5);
                    let cy = -t * (isPistil ? 170 : 150);

                    let color;
                    if (isPistil) {
                        color = t > 0.95 ? `hsla(130, 50%, 55%, 1)` : `hsla(70, 30%, 80%, 0.8)`;
                        if(t > 0.95) { ox += (Math.random()-0.5)*6; oy += (Math.random()-0.5)*6; oz += (Math.random()-0.5)*6; }
                    } else {
                        if (t > 0.92) {
                            ox += (Math.random() - 0.5) * 12; // Große Pollen-Köpfe
                            oy += (Math.random() - 0.5) * 20;
                            oz += (Math.random() - 0.5) * 12;
                            color = `hsla(25, 100%, 45%, 1)`; // Kräftiges Orange/Rost
                        } else {
                            color = `hsla(50, 40%, 80%, 0.6)`; // Feine Fäden
                        }
                    }
                    
                    points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, 0.4));
                }
            }
        }

        generateElegantLily();

        // --- TOUCH STEUERUNG ---
        let rotX = -0.2; 
        let rotY = 0;
        let vX = 0;
        let vY = 0.003; 
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function handlePointerDown(e) {
            if (targetBloom === 0) {
                targetBloom = 1;
                hint.style.opacity = '0';
            }

            isDragging = true;
            prevTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            prevTouchY = e.clientY || (e.touches && e.touches[0].clientY);
            vX = 0; vY = 0; 
        }

        function handlePointerMove(e) {
            if (isDragging) {
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                vY = (currentX - prevTouchX) * 0.005; 
                vX = (currentY - prevTouchY) * 0.005; 
                
                prevTouchX = currentX;
                prevTouchY = currentY;
            }
        }

        function handlePointerUp() {
            isDragging = false;
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('touchstart', handlePointerDown, {passive: true});
        window.addEventListener('touchmove', handlePointerMove, {passive: true});
        window.addEventListener('touchend', handlePointerUp);

        // --- RENDER LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 2, 0.5)'; // Sorgt für wunderschönen Motion-Blur und weiches Leuchten
            ctx.fillRect(0, 0, width, height);

            if (currentBloom < targetBloom) {
                currentBloom += 0.004; 
            }
            if (currentBloom > 0.95 && !isFullyBloomed) {
                isFullyBloomed = true;
                hint.innerHTML = "Wische, um die Details zu betrachten";
                hint.style.opacity = '1';
                hint.style.animation = 'none'; 
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.0, Math.min(1.0, rotX)); // Kamera sanft blockieren

            if (!isDragging) {
                vY *= 0.94;
                vX *= 0.94;
                if (Math.abs(vY) < 0.0005) vY += 0.002; 
            }

            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const centerX = width / 2;
            const centerY = height / 2 + 50; 

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(currentBloom);

                let x = p.x;
                let y = p.y;
                let z = p.z;

                // 3D Matrix
                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                let scale = fov / (fov + z2 + 350); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    let size = Math.max(0.6, 1.8 * scale); 
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
