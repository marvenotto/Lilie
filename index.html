<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Für Naya - 3D Point Cloud Lily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030303; /* Echtes Schwarz für den Point-Cloud Effekt */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; 
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
        .instruction {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 182, 193, 0.4); font-size: 11px; letter-spacing: 5px;
            text-transform: uppercase; font-weight: 300; pointer-events: none;
            transition: opacity 1s ease; text-align: center;
        }
    </style>
</head>
<body>
    <div class="instruction" id="hint">Tippe, um die 3D Punktwolke zu generieren</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let width, height;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        
        // Kamera & 3D Setup
        const fov = 400; // Sichtfeld (Perspective)
        let flowers = [];
        let isFirst = true;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Ein einzelner Punkt in der 3D-Wolke
        class Point3D {
            constructor(tx, ty, tz, color) {
                // Ziel-Koordinaten (Die fertige Blumenform)
                this.tx = tx; 
                this.ty = ty; 
                this.tz = tz;
                
                // Start-Koordinaten (Explodieren aus der Mitte)
                this.x = (Math.random() - 0.5) * 10;
                this.y = (Math.random() - 0.5) * 10;
                this.z = (Math.random() - 0.5) * 10;
                
                this.color = color;
                
                // Organisches Einfliegen an die Zielposition
                this.speed = 0.02 + Math.random() * 0.04;
                this.noiseX = (Math.random() - 0.5) * 20;
                this.noiseY = (Math.random() - 0.5) * 20;
                this.noiseZ = (Math.random() - 0.5) * 20;
            }

            update(progress) {
                // Fliegt smooth an die Ziel-Position (Interpolation)
                let ease = 1 - Math.pow(1 - progress, 3);
                this.x += (this.tx - this.x) * this.speed;
                this.y += (this.ty - this.y) * this.speed;
                this.z += (this.tz - this.z) * this.speed;
            }
        }

        // Die komplette 3D-Blume (Spinnenlilie)
        class PointCloudFlower {
            constructor(screenX, screenY) {
                this.screenX = screenX;
                this.screenY = screenY;
                this.points = [];
                this.progress = 0;
                this.rotationY = 0;
                
                // Warme, leuchtende Pink-Töne
                const baseHue = 330 + Math.random() * 25;
                
                // 1. GENERIERE DIE BLÜTENBLÄTTER (Petals)
                const numPetals = 6;
                for (let p = 0; p < numPetals; p++) {
                    const angle = (Math.PI * 2 / numPetals) * p;
                    
                    // Wir scatter tausende Punkte entlang einer geschwungenen Kurve
                    for (let i = 0; i < 400; i++) {
                        const t = Math.random(); // Position entlang des Blattes
                        
                        // Mathematische Kurve der Spinnenlilie in 3D
                        const radius = t * 120; // Wie weit nach außen
                        const heightY = Math.sin(t * Math.PI) * -60 + (t * t * 40); // Bogen nach oben, dann unten
                        
                        // Rauschen hinzufügen für die "Scanned Point Cloud" Optik
                        const scatterX = (Math.random() - 0.5) * (15 * t);
                        const scatterY = (Math.random() - 0.5) * 5;
                        const scatterZ = (Math.random() - 0.5) * (15 * t);
                        
                        // In 3D-Raum drehen
                        const tx = Math.cos(angle) * radius + scatterX;
                        const tz = Math.sin(angle) * radius + scatterZ;
                        const ty = heightY + scatterY;

                        const lightness = 40 + t * 40; // Spitzen sind heller
                        const color = `hsla(${baseHue}, 90%, ${lightness}%, 0.8)`;
                        
                        this.points.push(new Point3D(tx, ty, tz, color));
                    }
                }

                // 2. GENERIERE DIE LANGEN FÄDEN (Stamens)
                const numStamens = 7;
                for (let s = 0; s < numStamens; s++) {
                    const angle = (Math.PI * 2 / numStamens) * s + 0.5;
                    
                    for (let i = 0; i < 250; i++) {
                        const t = Math.random(); 
                        
                        const radius = t * 180; // Fäden sind länger als Blätter
                        const heightY = Math.sin(t * Math.PI * 0.8) * -120; // Weiterer Bogen
                        
                        const scatterX = (Math.random() - 0.5) * 4;
                        const scatterY = (Math.random() - 0.5) * 4;
                        const scatterZ = (Math.random() - 0.5) * 4;
                        
                        const tx = Math.cos(angle) * radius + scatterX;
                        const tz = Math.sin(angle) * radius + scatterZ;
                        const ty = heightY + scatterY;

                        // Leuchtende Spitzen
                        let color;
                        if (t > 0.95) {
                            color = `hsla(50, 100%, 75%, 0.9)`; // Goldene Pollen
                        } else {
                            color = `hsla(${baseHue + 15}, 80%, 75%, 0.6)`;
                        }
                        
                        this.points.push(new Point3D(tx, ty, tz, color));
                    }
                }
            }

            update() {
                if (this.progress < 1) {
                    this.progress += 0.01;
                }
                // Dreht die gesamte 3D-Wolke langsam um die Y-Achse
                this.rotationY += 0.005;
                
                this.points.forEach(p => p.update(this.progress));
            }

            draw(ctx) {
                const cosY = Math.cos(this.rotationY);
                const sinY = Math.sin(this.rotationY);
                
                // Wir sortieren die Punkte nicht strikt (aus Performancegründen),
                // der Screen-Blend-Modus sorgt trotzdem für perfekte Tiefenoptik!
                
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    
                    // 3D Rotation um die Y-Achse
                    const rotX = p.x * cosY - p.z * sinY;
                    const rotZ = p.z * cosY + p.x * sinY;
                    const rotY = p.y;
                    
                    // 3D zu 2D Projektion (Perspective)
                    const scale = fov / (fov + rotZ + 200); // 200 ist der Kamera-Abstand
                    const drawX = this.screenX + rotX * scale;
                    const drawY = this.screenY + rotY * scale;
                    
                    // Punkte, die "hinten" sind, sind kleiner und dunkler
                    if (scale > 0) {
                        ctx.fillStyle = p.color;
                        const size = Math.max(0.5, 1.5 * scale);
                        
                        // fillRect ist extrem performant für Point Clouds
                        ctx.fillRect(drawX, drawY, size, size);
                    }
                }
            }
        }

        // Interaktion
        function handlePointerDown(e) {
            if (isFirst) {
                hint.style.opacity = '0';
                isFirst = false;
            }
            let tx = e.clientX || (e.touches && e.touches[0].clientX);
            let ty = e.clientY || (e.touches && e.touches[0].clientY);
            
            // Spawne eine neue 3D Punktwolken-Blume
            flowers.push(new PointCloudFlower(tx, ty));
            
            // Halte den Speicher sauber (max 4 Blumen gleichzeitig)
            if (flowers.length > 4) flowers.shift();
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('touchstart', handlePointerDown, {passive: true});

        // Animations-Schleife
        function animate() {
            // Schwarzer Hintergrund mit extrem schwachem Ghosting-Effekt
            ctx.fillStyle = 'rgba(3, 3, 3, 0.6)';
            ctx.fillRect(0, 0, width, height);

            // Screen-Blending simuliert das Leuchten aus TouchDesigner
            ctx.globalCompositeOperation = 'screen';

            flowers.forEach(flower => {
                flower.update();
                flower.draw(ctx);
            });

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
