<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - 3D True Lily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030202; /* Tiefschwarz für perfekten Kontrast */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute;
            top: 12%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .greeting {
            color: #ffda75; 
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 3s ease forwards;
            animation-delay: 2s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.5); 
            font-size: 11px;
            letter-spacing: 8px;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 3s ease forwards;
            animation-delay: 3s;
        }
        .interaction-hint {
            position: absolute;
            bottom: 8%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            animation: pulseHint 4s infinite;
            animation-delay: 4.5s;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseHint {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint">Wische, um die Lilie im 3D-Raum zu betrachten</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 550; 
        let points = [];
        let globalProgress = 0;

        // --- DIE HOCHKOMPLEXE 3D-MATHEMATIK EINER ECHTEN LILIE ---
        function generateTrueLily() {
            points = [];
            const basePink = 335; // Hauptfarbe: Warmes Pink/Magenta
            
            // 1. DER STIEL & DIE BLÄTTER (Grün)
            for (let i = 0; i < 1500; i++) {
                let t = Math.random();
                let py = t * 400; // Stiel wächst nach unten
                let radius = 4 + Math.random() * 2;
                let angle = Math.random() * Math.PI * 2;
                
                let px = Math.cos(angle) * radius + (Math.random() - 0.5) * 2;
                let pz = Math.sin(angle) * radius + (Math.random() - 0.5) * 2;
                
                points.push(new Point3D(px, py + 20, pz, `hsla(120, 50%, 30%, 0.8)`));
            }

            // Einige seitliche grüne Lilien-Blätter am Stiel
            for (let leaf = 0; leaf < 6; leaf++) {
                let leafAngle = Math.random() * Math.PI * 2;
                let leafHeight = 100 + Math.random() * 200;
                
                for(let i = 0; i < 300; i++) {
                    let t = Math.random();
                    let w = (Math.random() - 0.5);
                    
                    let radius = t * 100;
                    let py = leafHeight + t * 50; 
                    let leafWidth = Math.sin(t * Math.PI) * 15;
                    let lateral = w * leafWidth;
                    
                    let px = Math.cos(leafAngle) * radius - Math.sin(leafAngle) * lateral;
                    let pz = Math.sin(leafAngle) * radius + Math.cos(leafAngle) * lateral;
                    
                    points.push(new Point3D(px, py, pz, `hsla(130, 45%, 35%, 0.7)`));
                }
            }

            // 2. DIE 6 BREITEN BLÜTENBLÄTTER (Tepals)
            for (let p = 0; p < 6; p++) {
                // 3 innere und 3 äußere Blätter (leicht versetzt für Volumen)
                let isInner = p % 2 === 0;
                let petalAngle = (Math.PI * 2 / 6) * p;
                
                // 1500 Punkte pro Blatt (extrem detailliert)
                for (let i = 0; i < 1500; i++) {
                    let t = Math.random(); // Länge (0 = Zentrum, 1 = Spitze)
                    // Mehr Punkte am Rand und in der Mitte konzentrieren
                    let w = (Math.random() - 0.5) * 2; // -1 bis 1
                    
                    // Form des Trichters: Erst steil nach oben (negatives Y), dann nach außen/unten rollend
                    let radius = t * 180;
                    // Die Biegung: Geht hoch, dann wieder leicht runter
                    let py = -Math.sin(t * Math.PI * 0.8) * 120 + Math.pow(t, 3) * 80;
                    
                    // Innere Blätter stehen etwas steiler
                    if (isInner) {
                        radius *= 0.9;
                        py -= 20 * t; 
                    }

                    // Die Breite des Blattes (Sehr breit in der Mitte, spitz zulaufend)
                    let petalWidth = Math.sin(t * Math.PI) * (1 - t * 0.2) * 55;
                    let lateral = w * petalWidth;
                    
                    // 3D Transformation
                    let px = Math.cos(petalAngle) * radius - Math.sin(petalAngle) * lateral;
                    let pz = Math.sin(petalAngle) * radius + Math.cos(petalAngle) * lateral;
                    
                    // Organisches Rauschen
                    px += (Math.random() - 0.5) * 2;
                    py += (Math.random() - 0.5) * 2 + (isInner ? -5 : 5);
                    pz += (Math.random() - 0.5) * 2;

                    // FARB-ALGORITHMUS (Multi-Color Lily)
                    let color;
                    let absW = Math.abs(w);
                    
                    if (t < 0.15) {
                        // Zentrum: Hellgrün / Gelblich
                        color = `hsla(80, 60%, 60%, 0.9)`;
                    } else if (absW > 0.7 && t > 0.3) {
                        // Äußerer Rand: Zartes Weiß/Hellrosa
                        color = `hsla(${basePink}, 20%, 90%, 0.8)`;
                    } else {
                        // Hauptfläche: Tiefes, warmes Pink
                        let saturation = 70 + (t * 20);
                        let lightness = 50 + (absW * 15); // Hellerer Streifen in der Mitte
                        color = `hsla(${basePink}, ${saturation}%, ${lightness}%, 0.85)`;
                    }
                    
                    // DIE SOMMERSPROSSEN (Speckles) - Typisch für Stargazer Lilien!
                    if (t > 0.2 && t < 0.7 && absW < 0.6) {
                        if (Math.random() < 0.04) {
                            // Dunkelrote/Magenta Punkte
                            color = `hsla(${basePink - 10}, 90%, 25%, 1)`;
                            // Speckles sind leicht erhaben
                            py -= 1.5; 
                        }
                    }
                    
                    points.push(new Point3D(px, py, pz, color));
                }
            }

            // 3. DIE 6 STAUBGEFÄßE & 1 STEMPEL (Mitte)
            // Stempel (Pistil) - Einer in der genauen Mitte
            for(let i = 0; i < 300; i++) {
                let t = Math.random();
                let py = -t * 130; 
                let px = (Math.random() - 0.5) * 3;
                let pz = (Math.random() - 0.5) * 3;
                
                // Spitze des Stempels ist leicht verdickt und andersfarbig
                if (t > 0.95) {
                    px *= 3; pz *= 3;
                    points.push(new Point3D(px, py, pz, `hsla(140, 50%, 60%, 0.9)`)); // Grüne Narbe
                } else {
                    points.push(new Point3D(px, py, pz, `hsla(70, 40%, 80%, 0.8)`)); // Weißer Griffel
                }
            }

            // 6 Staubgefäße (Stamens)
            for (let s = 0; s < 6; s++) {
                let angle = (Math.PI * 2 / 6) * s + (Math.PI / 6);
                
                for(let i = 0; i < 300; i++) {
                    let t = Math.random();
                    let radius = t * 40; // Gehen leicht nach außen
                    let py = -t * 110; // Etwas kürzer als der Stempel
                    
                    let px = Math.cos(angle) * radius + (Math.random() - 0.5) * 2;
                    let pz = Math.sin(angle) * radius + (Math.random() - 0.5) * 2;
                    
                    if (t > 0.9) {
                        // Antheren (Die dicken, Pollen-besetzten Spitzen)
                        px += (Math.random() - 0.5) * 8;
                        py += (Math.random() - 0.5) * 15; // Länglich
                        pz += (Math.random() - 0.5) * 8;
                        points.push(new Point3D(px, py, pz, `hsla(25, 90%, 45%, 1)`)); // Rostbraun/Orange
                    } else {
                        // Filamente (Fäden)
                        points.push(new Point3D(px, py, pz, `hsla(40, 50%, 85%, 0.6)`));
                    }
                }
            }
        }

        // --- 3D PARTIKEL KLASSE ---
        class Point3D {
            constructor(tx, ty, tz, color) {
                // Ziel-Koordinaten der Lilie
                this.tx = tx; 
                this.ty = ty; 
                this.tz = tz;
                
                // Start-Koordinaten (Sternenstaub-Explosion)
                let randomRadius = 50 + Math.random() * 400;
                let randomAngle1 = Math.random() * Math.PI * 2;
                let randomAngle2 = Math.random() * Math.PI * 2;
                this.x = Math.cos(randomAngle1) * Math.sin(randomAngle2) * randomRadius;
                this.y = Math.cos(randomAngle2) * randomRadius;
                this.z = Math.sin(randomAngle1) * Math.sin(randomAngle2) * randomRadius;
                
                this.color = color;
                
                // Geschmeidige Interpolation
                this.speed = 0.015 + Math.random() * 0.025;
                this.delay = Math.random() * 0.8;
            }

            update(progress) {
                if (progress > this.delay) {
                    // Cubic Ease-Out für weiches Einrasten der Punkte
                    let p = Math.min(1, (progress - this.delay) * 1.5);
                    let ease = 1 - Math.pow(1 - p, 4); 
                    
                    this.currentX = this.x + (this.tx - this.x) * ease;
                    this.currentY = this.y + (this.ty - this.y) * ease;
                    this.currentZ = this.z + (this.tz - this.z) * ease;
                } else {
                    this.currentX = this.x;
                    this.currentY = this.y;
                    this.currentZ = this.z;
                }
            }
        }

        generateTrueLily();

        // --- 3D TOUCH-STEUERUNG ---
        let rotX = -0.3; // Standardansicht leicht von oben
        let rotY = 0;
        let vX = 0;
        let vY = 0.003; // Extrem sanfte Auto-Rotation
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function handleStart(e) {
            isDragging = true;
            prevTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            prevTouchY = e.clientY || (e.touches && e.touches[0].clientY);
            vX = 0; vY = 0; 
        }

        function handleMove(e) {
            if (isDragging) {
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let dx = currentX - prevTouchX;
                let dy = currentY - prevTouchY;
                
                vY = dx * 0.004; 
                vX = dy * 0.004; 
                
                prevTouchX = currentX;
                prevTouchY = currentY;
            }
        }

        function handleEnd() {
            isDragging = false;
        }

        window.addEventListener('pointerdown', handleStart);
        window.addEventListener('pointermove', handleMove);
        window.addEventListener('pointerup', handleEnd);
        window.addEventListener('touchstart', handleStart, {passive: true});
        window.addEventListener('touchmove', handleMove, {passive: true});
        window.addEventListener('touchend', handleEnd);

        // --- RENDER LOOP ---
        function animate() {
            // Leichter Trail für magisches Glühen, kaschiert einzelne Pixel
            ctx.fillStyle = 'rgba(2, 1, 2, 0.4)';
            ctx.fillRect(0, 0, width, height);

            if (globalProgress < 2.0) {
                globalProgress += 0.006;
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.5, Math.min(1.5, rotX));

            if (!isDragging) {
                vY *= 0.94;
                vX *= 0.94;
                if (Math.abs(vY) < 0.0005) vY += 0.001; // Auto-Drehung aktivieren
            }

            // Screen-Blending simuliert Licht
            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const centerX = width / 2;
            const centerY = height / 2 + 50; 

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(globalProgress);

                let x = p.currentX;
                let y = p.currentY;
                let z = p.currentZ;

                // Rotation X
                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;

                // Rotation Y
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                // Perspektive
                let scale = fov / (fov + z2 + 250); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    let size = Math.max(0.6, 1.4 * scale);
                    
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
