<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - The Awakening</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020102; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .greeting {
            color: #ffda75; 
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 3s ease forwards;
            animation-delay: 1s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.5); 
            font-size: 11px;
            letter-spacing: 8px;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 3s ease forwards;
            animation-delay: 2s;
        }
        .interaction-hint {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s ease;
            animation: pulseHint 3s infinite;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseHint {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0); }
            50% { text-shadow: 0 0 20px rgba(255,255,255,0.8); }
            100% { text-shadow: 0 0 10px rgba(255,255,255,0); }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint" id="hint">Tippe, um die Blüte zu wecken</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 600; 
        let points = [];
        let pollenParticles = [];
        
        // Animations-Status
        let targetBloom = 0; // 0 = Geschlossen, 1 = Offen
        let currentBloom = 0;
        let isFullyBloomed = false;

        // --- 3D PARTIKEL MIT ZWEI ZUSTÄNDEN (Knospe & Blüte) ---
        class AnimatedPoint {
            constructor(cx, cy, cz, ox, oy, oz, color, bloomDelay) {
                // Position als geschlossene Knospe
                this.cx = cx; this.cy = cy; this.cz = cz;
                // Position als offene Blüte
                this.ox = ox; this.oy = oy; this.oz = oz;
                
                // Aktuelle Position
                this.x = cx; this.y = cy; this.z = cz;
                
                this.color = color;
                
                // Jedes Blatt und jeder Punkt blüht leicht verzögert auf für organische Optik
                this.bloomDelay = bloomDelay; 
            }

            update(globalBloom) {
                // Berechne individuellen Bloom-Status
                let localBloom = Math.max(0, Math.min(1, (globalBloom - this.bloomDelay) * 1.5));
                
                // Sanfte S-Kurve (Ease In Out) für das Erblühen
                let ease = localBloom < 0.5 
                    ? 2 * localBloom * localBloom 
                    : 1 - Math.pow(-2 * localBloom + 2, 2) / 2;

                this.x = this.cx + (this.ox - this.cx) * ease;
                this.y = this.cy + (this.oy - this.cy) * ease;
                this.z = this.cz + (this.oz - this.cz) * ease;
            }
        }

        // --- GENERATOR FÜR DIE HOCHKOMPLEXE LILIE ---
        function generateMorphingLily() {
            points = [];
            
            // 1. DIE 6 GIGANTISCHEN BLÜTENBLÄTTER
            for (let p = 0; p < 6; p++) {
                let isInner = p % 2 === 0;
                let petalAngle = (Math.PI * 2 / 6) * p;
                
                // 3000 Punkte pro Blatt (Extremes Impasto-Volumen!)
                for (let i = 0; i < 3000; i++) {
                    let t = Math.random(); 
                    let w = (Math.random() - 0.5) * 2; 
                    
                    // --- ZUSTAND 1: DIE OFFENE BLÜTE (ox, oy, oz) ---
                    let radiusOpen = t * 240;
                    let pyOpen = -Math.sin(t * Math.PI * 0.9) * 130 + Math.pow(t, 3) * 120;
                    
                    if (isInner) {
                        radiusOpen *= 0.9;
                        pyOpen -= 30 * t; 
                    }
                    let widthOpen = Math.sin(t * Math.PI) * (1 - t * 0.3) * 75;
                    let lateralOpen = w * widthOpen;
                    
                    let ox = Math.cos(petalAngle) * radiusOpen - Math.sin(petalAngle) * lateralOpen;
                    let oz = Math.sin(petalAngle) * radiusOpen + Math.cos(petalAngle) * lateralOpen;
                    let oy = pyOpen;
                    
                    // Organisches Rauschen
                    let noiseX = (Math.random() - 0.5) * 3;
                    let noiseY = (Math.random() - 0.5) * 3;
                    let noiseZ = (Math.random() - 0.5) * 3;
                    ox += noiseX; oy += noiseY; oz += noiseZ;

                    // --- ZUSTAND 2: DIE GESCHLOSSENE KNOSPE (cx, cy, cz) ---
                    let radiusClosed = t * 30 + Math.sin(t * Math.PI) * 15; // Sehr eng, tropfenförmig
                    let pyClosed = -t * 180; // Zeigt steil nach oben
                    let widthClosed = Math.sin(t * Math.PI) * 15;
                    let lateralClosed = w * widthClosed;
                    
                    // Die Blätter der Knospe drehen sich spiralförmig ineinander
                    let twist = t * Math.PI * 0.5;
                    let closedAngle = petalAngle + twist;

                    let cx = Math.cos(closedAngle) * radiusClosed - Math.sin(closedAngle) * lateralClosed;
                    let cz = Math.sin(closedAngle) * radiusClosed + Math.cos(closedAngle) * lateralClosed;
                    let cy = pyClosed;
                    cx += noiseX * 0.5; cy += noiseY * 0.5; cz += noiseZ * 0.5;

                    // --- FARBVERLAUF (Violett -> Magenta -> Gold) ---
                    let color;
                    let absW = Math.abs(w);
                    if (t < 0.2) {
                        color = `hsla(260, 80%, 40%, 0.9)`; // Tiefes Mystisches Violett im Zentrum
                    } else if (t > 0.85) {
                        color = `hsla(35, 100%, 65%, 0.9)`; // Gold/Orange an den Spitzen
                    } else {
                        let hue = 260 + (t * 80); // Faded von Violett(260) zu Pink/Magenta(340)
                        let lightness = 40 + (absW * 20) + (t * 20); 
                        color = `hsla(${hue}, 90%, ${lightness}%, 0.85)`;
                    }

                    // Sommersprossen (Dunkelviolett)
                    if (t > 0.3 && t < 0.7 && absW < 0.5 && Math.random() < 0.03) {
                        color = `hsla(280, 90%, 15%, 1)`;
                        oy -= 2; cy -= 1;
                    }

                    // Äußere Blätter blühen zuerst auf, innere folgen leicht verzögert
                    let delay = isInner ? 0.2 : 0.0;
                    points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, delay));
                }
            }

            // 2. DIE STAUBGEFÄßE (Schießen beim Öffnen hervor)
            for (let s = 0; s < 7; s++) {
                let angle = (Math.PI * 2 / 7) * s;
                
                for(let i = 0; i < 200; i++) {
                    let t = Math.random();
                    
                    // Offen
                    let radiusOpen = t * 150;
                    let pyOpen = -Math.sin(t * Math.PI * 0.7) * 160;
                    let ox = Math.cos(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oz = Math.sin(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oy = pyOpen + (Math.random()-0.5)*3;

                    // Geschlossen (Eingeklemmt im Zentrum)
                    let cx = Math.cos(angle) * (t * 5);
                    let cz = Math.sin(angle) * (t * 5);
                    let cy = -t * 150;

                    let color = t > 0.92 ? `hsla(45, 100%, 60%, 1)` : `hsla(320, 60%, 70%, 0.7)`;
                    
                    // Starten ganz am Ende der Animation
                    points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, 0.4));
                }
            }
        }

        generateMorphingLily();

        // --- 3D TOUCH-STEUERUNG ---
        let rotX = -0.2; 
        let rotY = 0;
        let vX = 0;
        let vY = 0.005; // Etwas schnellere Drehung am Anfang
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function handlePointerDown(e) {
            // TRIGGER FÜR DIE ANIMATION
            if (targetBloom === 0) {
                targetBloom = 1;
                hint.style.opacity = '0';
            }

            isDragging = true;
            prevTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            prevTouchY = e.clientY || (e.touches && e.touches[0].clientY);
            vX = 0; vY = 0; 
        }

        function handlePointerMove(e) {
            if (isDragging) {
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let dx = currentX - prevTouchX;
                let dy = currentY - prevTouchY;
                
                vY = dx * 0.005; 
                vX = dy * 0.005; 
                
                prevTouchX = currentX;
                prevTouchY = currentY;
            }
        }

        function handlePointerUp() {
            isDragging = false;
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('touchstart', handlePointerDown, {passive: true});
        window.addEventListener('touchmove', handlePointerMove, {passive: true});
        window.addEventListener('touchend', handlePointerUp);

        // --- RENDER LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 2, 0.5)';
            ctx.fillRect(0, 0, width, height);

            // Interpolation der Bloom-Animation (wird weich auf 1 gezählt)
            if (currentBloom < targetBloom) {
                currentBloom += 0.004; // Geschwindigkeit des Öffnens
            }
            if (currentBloom > 0.95 && !isFullyBloomed) {
                isFullyBloomed = true;
                hint.innerHTML = "Wische, um die Blume zu betrachten";
                hint.style.opacity = '1';
                hint.style.animation = 'none'; // Stoppt das Pulsieren
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));

            if (!isDragging) {
                vY *= 0.95;
                vX *= 0.95;
                if (Math.abs(vY) < 0.0005) vY += 0.002; 
            }

            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const centerX = width / 2;
            const centerY = height / 2 + 80; 

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(currentBloom);

                let x = p.x;
                let y = p.y;
                let z = p.z;

                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                let scale = fov / (fov + z2 + 350); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    // Die Punkte sind etwas dicker für den plastischen Impasto-Effekt
                    let size = Math.max(0.8, 1.8 * scale); 
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
