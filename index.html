<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Für Naya - Ästhetische Lilie</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1014 0%, #050203 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 182, 193, 0.4);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            pointer-events: none;
            transition: opacity 1s ease;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="instruction">Tippe für eine Lilie</div>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');

        let width, height;
        let dpr = Math.min(window.devicePixelRatio || 1, 2); // Gestochen scharfe Kanten
        let lilies = [];
        let isFirstInteraction = true;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Ease-Out Funktion für sanftes, natürliches Aufblühen
        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        class ElegantLily {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.progress = 0;
                this.age = 0;
                this.life = 600; // Wie lange die Blume bleibt
                this.baseRotation = Math.random() * Math.PI * 2;
                
                // Exklusive, warme Pink- und Rosatöne
                this.hue = 330 + Math.random() * 25; 
                this.size = 60 + Math.random() * 30;
                
                // Generiere die einzigartigen Eigenschaften dieser speziellen Lilie
                this.petalCount = 6; 
                this.petals = [];
                for(let i=0; i<this.petalCount; i++) {
                    this.petals.push({
                        angleOffset: (Math.PI * 2 / this.petalCount) * i + (Math.random() - 0.5) * 0.2,
                        lengthMod: 0.8 + Math.random() * 0.4,
                        widthMod: 0.6 + Math.random() * 0.4,
                        curl: (Math.random() - 0.5) * 0.8
                    });
                }

                // Staubgefäße (Die feinen, langen Fäden der Lilie)
                this.stamenCount = 7 + Math.floor(Math.random() * 3);
                this.stamens = [];
                for(let i=0; i<this.stamenCount; i++) {
                    this.stamens.push({
                        angle: Math.random() * Math.PI * 2,
                        lengthMod: 1.2 + Math.random() * 0.8,
                        curve: (Math.random() - 0.5) * 1.5
                    });
                }
            }

            update() {
                this.age++;
                if (this.progress < 1) {
                    this.progress += 0.015; // Wachstumsgeschwindigkeit
                    if (this.progress > 1) this.progress = 1;
                }
            }

            draw() {
                if (this.progress === 0) return;

                const growth = easeOutCubic(this.progress);
                const currentSize = this.size * growth;
                
                // Sanftes Ausblenden am Ende der Lebenszeit
                let alpha = 1;
                if (this.age > this.life - 100) {
                    alpha = Math.max(0, (this.life - this.age) / 100);
                }
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.baseRotation);
                ctx.globalAlpha = alpha;

                // 1. HAUPT-BLÜTENBLÄTTER ZEICHNEN
                for(let i=0; i<this.petalCount; i++) {
                    let p = this.petals[i];
                    ctx.save();
                    ctx.rotate(p.angleOffset);

                    let pLen = currentSize * 2.5 * p.lengthMod;
                    let pWidth = currentSize * 0.5 * p.widthMod;

                    // 3D-Volumen durch Farbverläufe (Licht und Schatten)
                    let grad = ctx.createLinearGradient(0, 0, pLen, 0);
                    grad.addColorStop(0, `hsla(${this.hue}, 90%, 20%, 1)`); // Tiefes Zentrum
                    grad.addColorStop(0.4, `hsla(${this.hue}, 85%, 60%, 1)`); // Kräftiges Pink
                    grad.addColorStop(1, `hsla(${this.hue}, 100%, 85%, 0.9)`); // Zarte helle Spitze

                    ctx.fillStyle = grad;
                    
                    // Zeichne das geschwungene Lilienblatt
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    
                    // Obere Kurve
                    ctx.bezierCurveTo(
                        pLen * 0.4, -pWidth, 
                        pLen * 0.8, -pWidth * 0.5 + p.curl * pWidth, 
                        pLen, p.curl * pWidth
                    );
                    
                    // Untere Kurve zurück zur Mitte
                    ctx.bezierCurveTo(
                        pLen * 0.8, pWidth * 0.5 + p.curl * pWidth, 
                        pLen * 0.4, pWidth, 
                        0, 0
                    );
                    
                    ctx.fill();
                    
                    // Feine Blattader in der Mitte
                    ctx.strokeStyle = `hsla(${this.hue}, 60%, 90%, 0.4)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(pLen * 0.5, p.curl * pWidth * 0.5, pLen * 0.9, p.curl * pWidth);
                    ctx.stroke();

                    ctx.restore();
                }

                // 2. LANGE STAUBGEFÄßE ZEICHNEN (Verzögert, wachsen aus der Mitte heraus)
                let stamenGrowth = Math.max(0, (growth - 0.4) * 1.6); // Startet später
                if (stamenGrowth > 0) {
                    for(let i=0; i<this.stamenCount; i++) {
                        let s = this.stamens[i];
                        ctx.save();
                        ctx.rotate(s.angle);

                        let sLen = currentSize * 3.5 * s.lengthMod * stamenGrowth;
                        
                        // Zarter, geschwungener Faden
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(sLen * 0.5, s.curve * currentSize, sLen, 0);
                        
                        ctx.strokeStyle = `hsla(${this.hue}, 90%, 75%, 0.8)`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        // Leuchtender Pollenkopf an der Spitze
                        ctx.beginPath();
                        ctx.arc(sLen, 0, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffda75'; // Gold
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#ffda75';
                        ctx.fill();
                        ctx.shadowBlur = 0; // Schatten zurücksetzen

                        ctx.restore();
                    }
                }

                ctx.restore();
            }
        }

        function spawnLily(x, y) {
            if (isFirstInteraction) {
                instruction.style.opacity = '0';
                isFirstInteraction = false;
            }
            lilies.push(new ElegantLily(x, y));
        }

        window.addEventListener('pointerdown', (e) => {
            spawnLily(e.clientX, e.clientY);
        });

        function animate() {
            // Extrem leichter Motion Blur für geschmeidige Optik
            ctx.fillStyle = 'rgba(10, 5, 8, 0.4)';
            ctx.fillRect(0, 0, width, height);
            
            for (let i = lilies.length - 1; i >= 0; i--) {
                const lily = lilies[i];
                lily.update();
                lily.draw();
                
                if (lily.age >= lily.life) {
                    lilies.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
