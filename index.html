<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - The Majestic Pink Lily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020101; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute; top: 12%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        /* Die neue, edle pinke Schrift */
        .greeting {
            color: #ff99c2; 
            font-size: 24px; font-weight: 300; letter-spacing: 5px;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 153, 194, 0.4);
            opacity: 0; transform: translateY(10px);
            animation: fadeUp 3s ease forwards; animation-delay: 1s; 
        }
        /* Das schlichtere "Von Marven" */
        .sub-greeting {
            color: rgba(255, 255, 255, 0.35); 
            font-size: 9px; letter-spacing: 8px;
            margin-top: 8px; text-transform: uppercase;
            opacity: 0; animation: fadeUp 3s ease forwards; animation-delay: 2s;
        }
        .interaction-hint {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; pointer-events: none;
            transition: opacity 1.5s ease; animation: pulseHint 3s infinite;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseHint {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }
    </style>
</head>
