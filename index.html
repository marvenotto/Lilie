<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digitale Blume</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Verhindert Scrollen beim Tippen auf dem Handy */
        }
        canvas {
            display: block;
        }
        #instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            pointer-events: none;
            transition: opacity 1s ease;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="instruction">Tippe auf den Bildschirm</div>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');

        let width, height;
        let particles = [];
        let isFirstInteraction = true;

        // Passt die Größe des Canvas an den Bildschirm an
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Partikel-Klasse für den "Point Cloud" Effekt (Spinnenlilie-Style)
        class Particle {
            constructor(x, y, type) {
                this.startX = x;
                this.startY = y;
                this.x = x;
                this.y = y;
                this.type = type; // 'stem', 'petal', 'stamen'
                
                this.age = 0;
                this.life = Math.random() * 100 + 100;
                
                // Rote/Pinke leuchtende Farben (wie im Video)
                const hue = 350 + Math.random() * 20; 
                this.color = `hsl(${hue}, 100%, 60%)`;
                this.size = Math.random() * 1.5 + 0.5;

                // Wachstumsvektoren
                const angle = (Math.random() - 0.5) * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                
                if (type === 'petal') {
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 2; // Leicht nach oben
                    this.curl = (Math.random() - 0.5) * 0.1; // Krümmung der Blütenblätter
                } else if (type === 'stamen') {
                    this.vx = Math.cos(angle) * speed * 1.5;
                    this.vy = Math.sin(angle) * speed * 1.5 - 3;
                    this.curl = (Math.random() - 0.5) * 0.05;
                }
            }

            update() {
                this.age++;
                if (this.type === 'petal' || this.type === 'stamen') {
                    // Partikel biegen sich nach außen und unten (wie echte Spinnenlilien)
                    const angle = Math.atan2(this.vy, this.vx);
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    
                    this.vx = Math.cos(angle + this.curl) * speed;
                    this.vy = Math.sin(angle + this.curl) * speed;
                    
                    this.vy += 0.05; // Schwerkraft
                    this.vx *= 0.98; // Luftwiderstand
                    this.vy *= 0.98;
                    
                    this.x += this.vx;
                    this.y += this.vy;
                }
            }

            draw() {
                const alpha = Math.max(0, 1 - (this.age / this.life));
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                
                // Leuchteffekt
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Extra leuchtender Punkt am Ende der Staubblätter (Stamens)
                if (this.type === 'stamen' && this.age > this.life * 0.5 && this.age % 5 === 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = "white";
                    ctx.fill();
                }
            }
        }

        // Funktion, um eine Blume an einer Position wachsen zu lassen
        function bloom(x, y) {
            if (isFirstInteraction) {
                instruction.style.opacity = '0';
                isFirstInteraction = false;
            }

            // Erzeuge Blütenblätter
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(x, y, 'petal'));
            }
            // Erzeuge die langen Staubblätter der Spinnenlilie
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, 'stamen'));
            }
        }

        // Interaktion mit Maus oder Touch
        window.addEventListener('pointerdown', (e) => {
            bloom(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            // Wenn der Nutzer zieht, wachsen kleine Funken/Blumen nach
            if (e.buttons > 0) {
                if(Math.random() > 0.7) {
                    bloom(e.clientX, e.clientY);
                }
            }
        });

        // Animations-Schleife
        function animate() {
            // Sanftes Ausblenden für einen coolen "Motion Blur" Effekt
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.globalCompositeOperation = 'lighter';

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.age >= p.life) {
                    particles.splice(i, 1);
                }
            }
            
            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
