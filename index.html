<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Multi-Bloom Lily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030202; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .greeting {
            color: #ffda75; 
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 3s ease forwards;
            animation-delay: 2s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.5); 
            font-size: 11px;
            letter-spacing: 8px;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 3s ease forwards;
            animation-delay: 3s;
        }
        .interaction-hint {
            position: absolute;
            bottom: 8%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            animation: pulseHint 4s infinite;
            animation-delay: 4.5s;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseHint {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint">Wische, um die Lilien im 3D-Raum zu betrachten</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 600; 
        let points = [];
        let globalProgress = 0;

        // --- HILFSFUNKTION FÜR LOKALE 3D-DREHUNGEN DER EINZELNEN BLÜTEN ---
        function rotate3D(x, y, z, rotX, rotY, rotZ) {
            // X-Achse
            let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
            let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
            let x1 = x;
            // Y-Achse
            let x2 = x1 * Math.cos(rotY) - z1 * Math.sin(rotY);
            let z2 = x1 * Math.sin(rotY) + z1 * Math.cos(rotY);
            let y2 = y1;
            // Z-Achse
            let x3 = x2 * Math.cos(rotZ) - y2 * Math.sin(rotZ);
            let y3 = x2 * Math.sin(rotZ) + y2 * Math.cos(rotZ);
            let z3 = z2;
            
            return { x: x3, y: y3, z: z3 };
        }

        // --- GENERIERT EINE EINZELNE BLÜTE AN EINER BESTIMMTEN POSITION ---
        function addLilyBloom(offsetX, offsetY, offsetZ, rotX, rotY, rotZ, scale, baseHue) {
            // 1. Die 6 Blütenblätter (Tepals)
            for (let p = 0; p < 6; p++) {
                let isInner = p % 2 === 0;
                let petalAngle = (Math.PI * 2 / 6) * p;
                
                // Reduzierte Punktzahl pro Blatt für mehr Klarheit bei mehreren Blüten
                for (let i = 0; i < 700; i++) {
                    let t = Math.random(); 
                    let w = (Math.random() - 0.5) * 2; 
                    
                    let radius = t * 180 * scale;
                    let py = (-Math.sin(t * Math.PI * 0.8) * 120 + Math.pow(t, 3) * 80) * scale;
                    
                    if (isInner) {
                        radius *= 0.9;
                        py -= 20 * t * scale; 
                    }

                    let petalWidth = Math.sin(t * Math.PI) * (1 - t * 0.2) * 55 * scale;
                    let lateral = w * petalWidth;
                    
                    let px = Math.cos(petalAngle) * radius - Math.sin(petalAngle) * lateral;
                    let pz = Math.sin(petalAngle) * radius + Math.cos(petalAngle) * lateral;
                    
                    px += (Math.random() - 0.5) * 2;
                    py += (Math.random() - 0.5) * 2 + (isInner ? -3 : 3);
                    pz += (Math.random() - 0.5) * 2;

                    // Farb-Algorithmus
                    let color;
                    let absW = Math.abs(w);
                    if (t < 0.15) {
                        color = `hsla(80, 60%, 50%, 0.8)`; // Grünes Zentrum
                    } else if (absW > 0.7 && t > 0.3) {
                        color = `hsla(${baseHue}, 20%, 90%, 0.7)`; // Heller Rand
                    } else {
                        let saturation = 70 + (t * 20);
                        let lightness = 50 + (absW * 15); 
                        color = `hsla(${baseHue}, ${saturation}%, ${lightness}%, 0.75)`;
                    }
                    
                    // Sommersprossen
                    if (t > 0.2 && t < 0.7 && absW < 0.6 && Math.random() < 0.04) {
                        color = `hsla(${baseHue - 15}, 90%, 25%, 0.9)`;
                        py -= 1.5; 
                    }
                    
                    // Transformation für diese spezifische Blüte
                    let rotated = rotate3D(px, py, pz, rotX, rotY, rotZ);
                    points.push(new Point3D(rotated.x + offsetX, rotated.y + offsetY, rotated.z + offsetZ, color));
                }
            }

            // 2. Staubgefäße und Stempel
            for (let s = 0; s < 7; s++) {
                let isPistil = (s === 6); // Der mittlere Stempel
                let angle = isPistil ? 0 : (Math.PI * 2 / 6) * s + (Math.PI / 6);
                
                for(let i = 0; i < (isPistil ? 150 : 100); i++) {
                    let t = Math.random();
                    let radius = isPistil ? ((Math.random()-0.5)*2) : (t * 35 * scale);
                    let py = -t * (isPistil ? 130 : 110) * scale;
                    
                    let px = Math.cos(angle) * radius + (Math.random() - 0.5) * 2;
                    let pz = Math.sin(angle) * radius + (Math.random() - 0.5) * 2;
                    
                    let color;
                    if (isPistil) {
                        color = t > 0.95 ? `hsla(140, 50%, 60%, 0.9)` : `hsla(70, 40%, 80%, 0.8)`;
                        if (t > 0.95) { px *= 3; pz *= 3; }
                    } else {
                        if (t > 0.9) {
                            px += (Math.random() - 0.5) * 6;
                            py += (Math.random() - 0.5) * 12; 
                            pz += (Math.random() - 0.5) * 6;
                            color = `hsla(25, 90%, 45%, 0.9)`; // Rostbraun Pollen
                        } else {
                            color = `hsla(40, 50%, 85%, 0.5)`;
                        }
                    }

                    let rotated = rotate3D(px, py, pz, rotX, rotY, rotZ);
                    points.push(new Point3D(rotated.x + offsetX, rotated.y + offsetY, rotated.z + offsetZ, color));
                }
            }
        }

        // --- BAUT DIE KOMPLETTE PFLANZE AUF ---
        function generatePlant() {
            points = [];
            
            // 1. HAUPTSTIEL (Zieht sich durch die ganze Pflanze)
            for (let i = 0; i < 2000; i++) {
                let t = Math.random();
                let py = -100 + t * 600; // Von oben nach ganz unten
                let radius = 4 + Math.random() * 2;
                let angle = Math.random() * Math.PI * 2;
                
                let px = Math.cos(angle) * radius + (Math.random() - 0.5) * 2;
                let pz = Math.sin(angle) * radius + (Math.random() - 0.5) * 2;
                
                // Leichte Biegung des Stiels
                px += Math.sin(t * Math.PI) * 20; 

                points.push(new Point3D(px, py, pz, `hsla(120, 50%, 25%, 0.8)`));
            }

            // 2. SEITENTRIEBE (Verbinden Stiel mit den seitlichen Blüten)
            // Trieb zur linken Blüte
            for(let i=0; i<400; i++) {
                let t = Math.random();
                let px = -60 * t; 
                let py = 120 - 40 * t; 
                let pz = 40 * t;
                points.push(new Point3D(px + (Math.random()-0.5)*3, py + (Math.random()-0.5)*3, pz + (Math.random()-0.5)*3, `hsla(120, 50%, 28%, 0.8)`));
            }
            // Trieb zur rechten Blüte
            for(let i=0; i<400; i++) {
                let t = Math.random();
                let px = 80 * t; 
                let py = 220 - 30 * t; 
                let pz = -30 * t;
                points.push(new Point3D(px + (Math.random()-0.5)*3, py + (Math.random()-0.5)*3, pz + (Math.random()-0.5)*3, `hsla(120, 50%, 28%, 0.8)`));
            }

            // 3. DIE 3 BLÜTEN PLATZIEREN (OffsetX, OffsetY, OffsetZ, RotX, RotY, RotZ, Scale, Hue)
            
            // Hauptblüte (Ganz oben, majestätisch, guckt leicht nach oben/vorne)
            // Hue 335 = Intensives Magenta-Pink
            addLilyBloom(0, -100, 0, 0.2, 0, 0, 1.0, 335); 
            
            // Zweite Blüte (Mitte-links, guckt nach links und etwas nach unten)
            // Hue 345 = Geht minimal mehr ins Rötlich-Pinke
            addLilyBloom(-80, 80, 50, 0.4, -0.8, -0.4, 0.85, 345);
            
            // Dritte Blüte (Unten-rechts, guckt nach rechts)
            // Hue 325 = Geht minimal mehr ins kühlere Pfirsich-Rosa
            addLilyBloom(100, 190, -40, 0.3, 1.2, 0.3, 0.75, 325);
        }

        // --- 3D PARTIKEL KLASSE ---
        class Point3D {
            constructor(tx, ty, tz, color) {
                this.tx = tx; 
                this.ty = ty; 
                this.tz = tz;
                
                // Start-Koordinaten (Sternenstaub-Explosion)
                let randomRadius = 100 + Math.random() * 500;
                let randomAngle1 = Math.random() * Math.PI * 2;
                let randomAngle2 = Math.random() * Math.PI * 2;
                this.x = Math.cos(randomAngle1) * Math.sin(randomAngle2) * randomRadius;
                this.y = Math.cos(randomAngle2) * randomRadius;
                this.z = Math.sin(randomAngle1) * Math.sin(randomAngle2) * randomRadius;
                
                this.color = color;
                
                this.speed = 0.015 + Math.random() * 0.025;
                this.delay = Math.random() * 1.2; // Längeres Delay für dramatischen Aufbau
            }

            update(progress) {
                if (progress > this.delay) {
                    let p = Math.min(1, (progress - this.delay) * 1.2);
                    let ease = 1 - Math.pow(1 - p, 4); 
                    
                    this.currentX = this.x + (this.tx - this.x) * ease;
                    this.currentY = this.y + (this.ty - this.y) * ease;
                    this.currentZ = this.z + (this.tz - this.z) * ease;
                } else {
                    this.currentX = this.x;
                    this.currentY = this.y;
                    this.currentZ = this.z;
                }
            }
        }

        generatePlant();

        // --- 3D TOUCH-STEUERUNG ---
        let rotX = -0.1; 
        let rotY = 0;
        let vX = 0;
        let vY = 0.003; 
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        function handleStart(e) {
            isDragging = true;
            prevTouchX = e.clientX || (e.touches && e.touches[0].clientX);
            prevTouchY = e.clientY || (e.touches && e.touches[0].clientY);
            vX = 0; vY = 0; 
        }

        function handleMove(e) {
            if (isDragging) {
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let dx = currentX - prevTouchX;
                let dy = currentY - prevTouchY;
                
                vY = dx * 0.004; 
                vX = dy * 0.004; 
                
                prevTouchX = currentX;
                prevTouchY = currentY;
            }
        }

        function handleEnd() {
            isDragging = false;
        }

        window.addEventListener('pointerdown', handleStart);
        window.addEventListener('pointermove', handleMove);
        window.addEventListener('pointerup', handleEnd);
        window.addEventListener('touchstart', handleStart, {passive: true});
        window.addEventListener('touchmove', handleMove, {passive: true});
        window.addEventListener('touchend', handleEnd);

        // --- RENDER LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 2, 0.4)';
            ctx.fillRect(0, 0, width, height);

            if (globalProgress < 2.5) {
                globalProgress += 0.006;
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.0, Math.min(1.0, rotX)); // Kamera-Limitierung

            if (!isDragging) {
                vY *= 0.94;
                vX *= 0.94;
                if (Math.abs(vY) < 0.0005) vY += 0.001; 
            }

            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const centerX = width / 2;
            const centerY = height / 2 - 20; // Etwas zentrierter

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(globalProgress);

                let x = p.currentX;
                let y = p.currentY;
                let z = p.currentZ;

                // Rotation X
                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;

                // Rotation Y
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                // Perspektive
                let scale = fov / (fov + z2 + 300); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    let size = Math.max(0.5, 1.3 * scale);
                    
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
