<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - The Rebirth Lily</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020101; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Zwingt Handys dazu, Touch-Gesten exklusiv für das Canvas zu nutzen */
            touch-action: none; 
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block; width: 100%; height: 100%; cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .greeting-container {
            position: absolute; top: 12%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .greeting {
            color: #ffda75; font-size: 24px; font-weight: 300; letter-spacing: 5px;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 218, 117, 0.4);
            opacity: 0; transform: translateY(10px);
            animation: fadeUp 3s ease forwards; animation-delay: 1s; 
        }
        .sub-greeting {
            color: rgba(255, 255, 255, 0.6); font-size: 11px; letter-spacing: 7px;
            margin-top: 8px; text-transform: uppercase;
            opacity: 0; animation: fadeUp 3s ease forwards; animation-delay: 2s;
        }
        .interaction-hint {
            position: absolute; bottom: 12%; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase; pointer-events: none;
            transition: opacity 1.5s ease; animation: pulseHint 3s infinite;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseHint {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="greeting-container">
        <div class="greeting">Happy Birthday, Naya</div>
        <div class="sub-greeting">14. September ✨ Von Marven</div>
    </div>
    
    <div class="interaction-hint" id="hint">Tippe 1x zum Entfalten • Tippe 2x für einen Wechsel</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const fov = 650; 
        let points = [];
        let targetBloom = 0; 
        let currentBloom = 0;
        let isFullyBloomed = false;
        let isReblooming = false;

        // --- DIE HARMONISCHEN FARB-PALETTEN (Basierend auf dem Foto) ---
        const palettes = [
            // 0: Burgunder-Zentrum mit leuchtend gelben Rändern (wie vorne links)
            { center: {h: 350, s: 90, l: 20}, edge: {h: 50, s: 100, l: 50}, speckle: {h: 350, s: 100, l: 15} },
            // 1: Reinweiß mit dunkelroten Punkten (wie rechts)
            { center: {h: 120, s: 30, l: 80}, edge: {h: 0, s: 0, l: 95}, speckle: {h: 350, s: 90, l: 30} },
            // 2: Warmes Rosa/Pink mit Magentapunkten (wie rechts unten)
            { center: {h: 335, s: 80, l: 50}, edge: {h: 340, s: 60, l: 85}, speckle: {h: 330, s: 90, l: 25} },
            // 3: Knalliges Orange mit braunen Punkten (wie links)
            { center: {h: 20, s: 90, l: 50}, edge: {h: 30, s: 100, l: 60}, speckle: {h: 10, s: 90, l: 20} },
            // 4: Sonnengelb mit dunklen Punkten (wie oben rechts)
            { center: {h: 50, s: 90, l: 40}, edge: {h: 60, s: 100, l: 60}, speckle: {h: 20, s: 90, l: 20} }
        ];
        let currentPaletteIndex = 0;

        function lerpColor(c1, c2, t) {
            return {
                h: c1.h + (c2.h - c1.h) * t,
                s: c1.s + (c2.s - c1.s) * t,
                l: c1.l + (c2.l - c1.l) * t
            };
        }

        class AnimatedPoint {
            constructor(cx, cy, cz, ox, oy, oz, color, bloomDelay) {
                this.cx = cx; this.cy = cy; this.cz = cz; 
                this.ox = ox; this.oy = oy; this.oz = oz; 
                this.x = cx; this.y = cy; this.z = cz;
                this.color = color;
                
                this.bloomDelay = bloomDelay; 
                this.bloomSpeed = 0.8 + Math.random() * 0.4; 
            }

            update(globalBloom) {
                let localBloom = Math.max(0, Math.min(1, (globalBloom - this.bloomDelay) * this.bloomSpeed * 1.5));
                let ease = localBloom < 0.5 ? 2 * localBloom * localBloom : 1 - Math.pow(-2 * localBloom + 2, 2) / 2;

                this.x = this.cx + (this.ox - this.cx) * ease;
                this.y = this.cy + (this.oy - this.cy) * ease;
                this.z = this.cz + (this.oz - this.cz) * ease;
            }
        }

        function generateElegantLily() {
            points = [];
            const theme = palettes[currentPaletteIndex];
            
            // Jede Blume wird durch organische Zufallswerte einzigartig!
            let randomLiftMod = 0.8 + Math.random() * 0.4;
            let randomDropMod = 0.7 + Math.random() * 0.6;
            let randomTwist = (Math.random() - 0.5) * 0.3;

            const layers = [
                { count: 3, radius: 260, lift: 90 * randomLiftMod, drop: 50 * randomDropMod, delay: 0.0, points: 4500, offsetAngle: 0 },
                { count: 3, radius: 250, lift: 110 * randomLiftMod, drop: 30 * randomDropMod, delay: 0.2, points: 4500, offsetAngle: Math.PI / 3 }
            ];

            layers.forEach((layer, layerIndex) => {
                for (let p = 0; p < layer.count; p++) {
                    let baseAngle = (Math.PI * 2 / layer.count) * p + layer.offsetAngle + randomTwist;

                    for (let i = 0; i < layer.points; i++) {
                        let t = Math.random(); 
                        let w = (Math.random() - 0.5) * 2; 
                        let absW = Math.abs(w);
                        
                        let radiusOpen = t * layer.radius;
                        let pyOpen = -Math.sin(t * Math.PI * 0.7) * layer.lift + Math.pow(t, 2.5) * layer.drop;
                        
                        let widthOpen = Math.sin(t * Math.PI) * (1 - t * 0.15) * 85;
                        let ruffles = Math.sin(t * 20) * Math.sin(w * Math.PI) * (5 * t); 
                        
                        let midrib = Math.max(0, 1 - absW * 5) * 12 * Math.sin(t * Math.PI);
                        pyOpen += midrib;

                        let lateralOpen = w * widthOpen + ruffles;
                        
                        let ox = Math.cos(baseAngle) * radiusOpen - Math.sin(baseAngle) * lateralOpen;
                        let oz = Math.sin(baseAngle) * radiusOpen + Math.cos(baseAngle) * lateralOpen;
                        let oy = pyOpen;
                        
                        let nX = (Math.random() - 0.5) * 3;
                        let nY = (Math.random() - 0.5) * 3;
                        let nZ = (Math.random() - 0.5) * 3;
                        ox += nX; oy += nY; oz += nZ;

                        let radiusClosed = t * 35 + Math.sin(t * Math.PI) * 20; 
                        let pyClosed = -t * (240 - layerIndex * 15); 
                        let widthClosed = Math.sin(t * Math.PI) * 25;
                        let lateralClosed = w * widthClosed;
                        
                        let closedAngle = baseAngle + (t * Math.PI * 0.5); 

                        let cx = Math.cos(closedAngle) * radiusClosed - Math.sin(closedAngle) * lateralClosed;
                        let cz = Math.sin(closedAngle) * radiusClosed + Math.cos(closedAngle) * lateralClosed;
                        let cy = pyClosed;
                        cx += nX*0.5; cy += nY*0.5; cz += nZ*0.5;

                        // --- DER NEUE, FLIEßENDE FARBVERLAUF ---
                        let color;
                        // Mischen der Farbe von Zentrum (t=0) zu Rand (t=1 & absW=1)
                        let colorBlend = Math.min(1, t * 0.8 + absW * 0.4); 
                        let c = lerpColor(theme.center, theme.edge, colorBlend);
                        
                        // Äußere Blätter minimal abdunkeln für Tiefe
                        if (layerIndex === 0) c.l -= 5;
                        color = `hsla(${c.h}, ${c.s}%, ${c.l}%, 0.85)`;

                        // Sommersprossen aus dem Farbthema!
                        if (t > 0.25 && t < 0.65 && absW < 0.45) {
                            if (Math.random() < 0.05) {
                                color = `hsla(${theme.speckle.h}, ${theme.speckle.s}%, ${theme.speckle.l}%, 1)`;
                                oy -= 2; cy -= 1; 
                            }
                        }

                        let individualDelay = layer.delay + (Math.random() * 0.1);
                        points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, individualDelay));
                    }
                }
            });

            // STAUBGEFÄßE (Pistils & Stamens)
            for (let s = 0; s < 7; s++) { 
                let isPistil = (s === 6);
                let angle = isPistil ? 0 : (Math.PI * 2 / 6) * s + (Math.PI / 6) + randomTwist;
                
                for(let i = 0; i < (isPistil ? 200 : 150); i++) {
                    let t = Math.random();
                    
                    let radiusOpen = isPistil ? (t * 20) : (t * 120);
                    let pyOpen = -Math.sin(t * Math.PI * 0.8) * (isPistil ? 160 : 140);
                    
                    let ox = Math.cos(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oz = Math.sin(angle) * radiusOpen + (Math.random()-0.5)*3;
                    let oy = pyOpen + (Math.random()-0.5)*3;

                    let cx = Math.cos(angle) * (t * 5);
                    let cz = Math.sin(angle) * (t * 5);
                    let cy = -t * (isPistil ? 170 : 150);

                    let color;
                    if (isPistil) {
                        color = t > 0.95 ? `hsla(130, 50%, 55%, 1)` : `hsla(70, 30%, 80%, 0.8)`;
                        if(t > 0.95) { ox += (Math.random()-0.5)*6; oy += (Math.random()-0.5)*6; oz += (Math.random()-0.5)*6; }
                    } else {
                        if (t > 0.92) {
                            ox += (Math.random() - 0.5) * 12; 
                            oy += (Math.random() - 0.5) * 20;
                            oz += (Math.random() - 0.5) * 12;
                            color = `hsla(25, 100%, 45%, 1)`; // Kräftiges Orange/Rost
                        } else {
                            color = `hsla(50, 40%, 80%, 0.6)`; 
                        }
                    }
                    
                    points.push(new AnimatedPoint(cx, cy, cz, ox, oy, oz, color, 0.4));
                }
            }
        }

        generateElegantLily();

        // --- HANDY OPTIMIERTE TOUCH STEUERUNG & DOPPELKLICK ---
        let rotX = -0.2; 
        let rotY = 0;
        let vX = 0;
        let vY = 0.003; 
        
        let isDragging = false;
        let prevTouchX = 0;
        let prevTouchY = 0;
        let lastTapTime = 0;

        function triggerRebloom() {
            if (isReblooming) return;
            isReblooming = true;
            targetBloom = 0; // Blüte schließt sich
            hint.style.opacity = '0';
            
            setTimeout(() => {
                // Wenn geschlossen, wechsle Farbe und Form
                currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
                generateElegantLily();
                targetBloom = 1; // Blüte öffnet sich wieder
                
                setTimeout(() => { isReblooming = false; }, 1500);
            }, 1200); // Wartet bis sie komplett geschlossen ist
        }

        function getPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handlePointerDown(e) {
            let now = Date.now();
            let pos = getPos(e);

            // DOPPELKLICK ERKENNUNG
            if (now - lastTapTime < 300) {
                triggerRebloom();
            }
            lastTapTime = now;

            if (targetBloom === 0 && !isReblooming) {
                targetBloom = 1;
                hint.style.opacity = '0';
            }

            isDragging = true;
            prevTouchX = pos.x;
            prevTouchY = pos.y;
            vX = 0; vY = 0; 
        }

        function handlePointerMove(e) {
            if (isDragging) {
                let pos = getPos(e);
                vY = (pos.x - prevTouchX) * 0.005; 
                vX = (pos.y - prevTouchY) * 0.005; 
                prevTouchX = pos.x;
                prevTouchY = pos.y;
            }
        }

        function handlePointerUp() {
            isDragging = false;
        }

        // Native Gesten komplett blockieren für flüssiges 3D Wischen
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); handlePointerUp(e); }, {passive: false});
        
        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        // --- RENDER LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 2, 0.4)'; 
            ctx.fillRect(0, 0, width, height);

            // Blühen und Schließen steuern
            if (currentBloom < targetBloom) currentBloom += 0.005; 
            if (currentBloom > targetBloom) currentBloom -= 0.005; 

            if (currentBloom > 0.95 && !isFullyBloomed && !isReblooming) {
                isFullyBloomed = true;
                hint.innerHTML = "Wische, um sie zu betrachten";
                hint.style.opacity = '1';
                hint.style.animation = 'none'; 
            }

            rotY += vY;
            rotX += vX;
            rotX = Math.max(-1.0, Math.min(1.0, rotX)); 

            if (!isDragging) {
                vY *= 0.94;
                vX *= 0.94;
                if (Math.abs(vY) < 0.0005) vY += 0.002; 
            }

            // ORGANISCHES "ATMEN" (Pulsiert ganz leicht durch Sinuswellen)
            let breathX = Math.sin(Date.now() * 0.001) * 0.02;
            let breathY = Math.cos(Date.now() * 0.0008) * 0.02;

            ctx.globalCompositeOperation = 'screen';

            const cosX = Math.cos(rotX + breathX), sinX = Math.sin(rotX + breathX);
            const cosY = Math.cos(rotY + breathY), sinY = Math.sin(rotY + breathY);

            const centerX = width / 2;
            const centerY = height / 2 + 50; 

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.update(currentBloom);

                let x = p.x;
                let y = p.y;
                let z = p.z;

                let y1 = y * cosX - z * sinX;
                let z1 = y * sinX + z * cosX;
                let x2 = x * cosY + z1 * sinY;
                let z2 = -x * sinY + z1 * cosY;
                let y2 = y1;

                let scale = fov / (fov + z2 + 350); 
                
                if (scale > 0) {
                    let drawX = centerX + x2 * scale;
                    let drawY = centerY + y2 * scale;
                    
                    ctx.fillStyle = p.color;
                    let size = Math.max(0.6, 1.8 * scale); 
                    ctx.fillRect(drawX, drawY, size, size);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
